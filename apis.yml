aid: fitstar
name: FitStar
description: >-
  FitStar Labs, Inc. was a San Francisco based consumer fitness company that built
  FitStar Personal Trainer and FitStar Yoga, adaptive video workout apps that adjusted
  each session to the user's feedback and fitness level. Backed by GV (Google Ventures)
  and Trinity Ventures, FitStar was acquired by Fitbit on March 5, 2015 for $17.8
  million and folded into the Fitbit Coach product line. The company is DEFUNCT: the
  fitstar.com domain no longer serves web content (last archived live October 2017),
  the FitStar apps have been retired, and no developer portal, documentation, or public
  API surface survives. This profile is retained as a historical record in the API
  Evangelist network; there is nothing to enrich beyond identity and domain posture.
